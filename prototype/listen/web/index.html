<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听说 · 听力理解</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="masthead">
    <p class="eyebrow">Hearsay · 听力原型</p>
    <h1>听懂了吗，做题看看</h1>
    <p class="lede">逐句听材料，做主旨、细节、听写和听辨题。规则判定；inference 与口头回答未接。</p>
  </header>

  <section class="panel">
    <h2 id="material-title">载入中…</h2>
    <audio id="audio" preload="auto"></audio>
    <div id="sentences"></div>
  </section>

  <section class="panel">
    <h2>题目</h2>
    <div id="questions"></div>
    <div class="row">
      <button id="finish" class="primary" type="button">完成并出结果</button>
      <span id="status" class="status" role="status"></span>
    </div>
  </section>

  <section id="result" class="panel" hidden>
    <h2>结果</h2>
    <p id="summary"></p>
    <div id="detail"></div>
    <p id="ingest-note" class="note"></p>
  </section>

  <script src="/app.js"></script>
</body>
</html>
