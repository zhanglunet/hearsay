<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听说 · Hearsay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="masthead">
    <p class="eyebrow">Hearsay · 听说</p>
    <h1>今天练什么</h1>
    <p class="lede">听 → 跟读 → 复述 → 对话，再从你的错误里长出复习。</p>
  </header>

  <section class="panel">
    <div class="row">
      <h2>今日计划</h2>
      <label class="note">分钟 <input id="minutes" type="number" value="15" min="5" max="120"></label>
      <button id="reload" type="button">重新编排</button>
    </div>
    <p id="rationale" class="note"></p>
    <div id="blocks"></div>
    <div id="due-cards"></div>
  </section>

  <section class="panel">
    <h2>can-do 进度</h2>
    <p id="progress-summary" class="note"></p>
    <p class="note">没有宝石，只有「能做什么」的证据。完整进度在 <a href="http://127.0.0.1:8767/" target="_blank">M4 进度页</a>。</p>
  </section>

  <section class="panel">
    <h2>各练习入口</h2>
    <div id="slices" class="slice-links"></div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
